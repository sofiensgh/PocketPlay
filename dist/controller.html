<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>PocketPlay — Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
    <style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{color:#fff;-webkit-user-select:none;user-select:none;overscroll-behavior:none;background:#1a1a2e;flex-direction:column;justify-content:center;align-items:center;min-height:100dvh;margin:0;padding:20px;font-family:Inter,sans-serif;display:flex}section{flex-direction:column;align-items:center;width:100%;max-width:420px;display:flex}section[hidden]{display:none}#status{color:#a0a0b8;text-align:center;min-height:1.5em;margin:0 0 18px;font-size:1rem}#status.error{color:#ff7675}#join-panel{gap:14px}#name-input{color:#fff;text-align:center;background:#0f0f1a;border:2px solid #2e2e44;border-radius:16px;width:100%;padding:17px;font-family:Inter,sans-serif;font-size:1.15rem}#name-input:focus{border-color:#6c5ce7;outline:none}#join-btn{color:#0f0f1a;cursor:pointer;background:#00d2a8;border:none;border-radius:16px;width:100%;padding:18px;font-family:Poppins,sans-serif;font-size:1.2rem;font-weight:700}#join-btn:disabled{opacity:.4}#waiting-panel{text-align:center}.waiting-title{margin:0 0 10px;font-family:Poppins,sans-serif;font-size:1.25rem;font-weight:600}#waiting-text{color:#a0a0b8;margin:0;line-height:1.5}.controller-hud{color:#a0a0b8;justify-content:space-between;align-items:center;width:100%;margin-bottom:10px;font-family:Poppins,sans-serif;font-weight:600;display:flex}#c-timer{color:#00d2a8;font-size:1.3rem}#c-timer.urgent{color:#ff7675}#c-question{text-align:center;margin:4px 0 14px;font-family:Poppins,sans-serif;font-size:1.15rem;font-weight:600;line-height:1.4}.feedback{text-align:center;min-height:1.6em;margin:0 0 14px;font-family:Poppins,sans-serif;font-size:1.05rem;font-weight:700}.feedback.accent{color:#a29bfe}.feedback.good{color:#00d2a8}.feedback.bad{color:#ff7675}.feedback.muted{color:#a0a0b8;font-size:.98rem;font-weight:600}.button-grid{grid-template-columns:1fr 1fr;gap:12px;width:100%;display:grid}.answer-btn{color:#fff;touch-action:none;cursor:pointer;background:#0f0f1a;border:2px solid #2e2e44;border-radius:20px;flex-direction:column;justify-content:center;align-items:center;gap:11px;min-height:112px;padding:16px 12px;font-family:Inter,sans-serif;transition:transform 50ms,border-color .15s,background .15s,opacity .2s;display:flex}.answer-btn:not(:disabled):active{transform:scale(.96)}.answer-btn:disabled{cursor:default}.badge{border-radius:11px;place-items:center;width:38px;height:38px;font-family:Poppins,sans-serif;font-size:1.15rem;font-weight:700;display:grid}.badge-a{color:#fff;background:#6c5ce7}.badge-b{color:#0f0f1a;background:#00d2a8}.badge-x{color:#fff;background:#fd79a8}.badge-y{color:#0f0f1a;background:#fdcb6e}.answer-btn .answer-text{text-align:center;font-size:1rem;font-weight:600;line-height:1.3}.answer-btn.chosen{background:#6c5ce733;border-color:#6c5ce7}.answer-btn.correct{background:#00d2a829;border-color:#00d2a8}.answer-btn.wrong{background:#ff767524;border-color:#ff7675}.answer-btn.dimmed{opacity:.4}#end-panel{text-align:center}.end-title{margin:0 0 8px;font-family:Poppins,sans-serif;font-size:1.5rem;font-weight:700}#end-text{color:#a0a0b8;margin:0 0 18px;line-height:1.5}#end-scores{width:100%;margin:0;padding:0;list-style:none}#end-scores li{background:#0f0f1a;border-radius:13px;justify-content:space-between;margin-bottom:9px;padding:12px 18px;font-weight:600;display:flex}#end-scores li span:last-child{color:#00d2a8;font-family:Poppins,sans-serif;font-weight:700}</style>
  <script type="module" crossorigin src="/assets/controller-_afGyhLC.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/dist-DLUt_2_r.js">
</head>
<body>
    <section id="join-panel">
        <p id="status">Connecting...</p>
        <input id="name-input" type="text" placeholder="Your name" maxlength="12" autocomplete="off" />
        <button id="join-btn">JOIN GAME</button>
    </section>

    <section id="waiting-panel" hidden>
        <p class="waiting-title">Connected!</p>
        <p id="waiting-text">Waiting for the host to start the game...</p>
    </section>

    <section id="game-panel" hidden>
        <div class="controller-hud">
            <span id="c-q-counter">Q1 / 10</span>
            <span id="c-timer">20</span>
        </div>
        <p id="c-question"></p>
        <p id="c-feedback" class="feedback"></p>
        <div class="button-grid">
            <button class="answer-btn" data-index="0">
                <span class="badge badge-a">A</span>
                <span class="answer-text"></span>
            </button>
            <button class="answer-btn" data-index="1">
                <span class="badge badge-b">B</span>
                <span class="answer-text"></span>
            </button>
            <button class="answer-btn" data-index="2">
                <span class="badge badge-x">X</span>
                <span class="answer-text"></span>
            </button>
            <button class="answer-btn" data-index="3">
                <span class="badge badge-y">Y</span>
                <span class="answer-text"></span>
            </button>
        </div>
    </section>

    <section id="end-panel" hidden>
        <p class="end-title">Game over</p>
        <p id="end-text"></p>
        <ul id="end-scores"></ul>
    </section>

</body>
</html>
