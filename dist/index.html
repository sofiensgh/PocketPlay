ground:#1a1a2e;border-radius:999px;flex:1;height:12px;overflow:hidden}#timer-fill{background:linear-gradient(90deg,#6c5ce7,#00d2a8);border-radius:999px;width:100%;height:100%;transition:width 1s linear}#timer-fill.urgent{background:#ff7675}#timer-num{text-align:right;min-width:2ch;font-family:Poppins,sans-serif;font-size:1.5rem;font-weight:700}#timer-num.urgent{color:#ff7675}#question-text{text-align:center;max-width:900px;margin:30px 0 0;font-family:Poppins,sans-serif;font-size:2.1rem;font-weight:700;line-height:1.3}#reveal-banner{color:#00d2a8;text-align:center;min-height:1.6em;margin-top:16px;font-family:Poppins,sans-serif;font-size:1.3rem;font-weight:600}#answers{grid-template-columns:1fr 1fr;gap:18px;width:100%;max-width:900px;margin-top:26px;display:grid}.answer{background:#1a1a2e;border:2px solid #0000;border-radius:20px;align-items:center;gap:18px;padding:20px 24px;transition:border-color .2s,background .2s,opacity .3s;display:flex}.badge{border-radius:13px;flex-shrink:0;place-items:center;width:46px;height:46px;font-family:Poppins,sans-serif;font-size:1.35rem;font-weight:700;display:grid}.badge-a{color:#fff;background:#6c5ce7}.badge-b{color:#0f0f1a;background:#00d2a8}.badge-x{color:#fff;background:#fd79a8}.badge-y{color:#0f0f1a;background:#fdcb6e}.answer-body{min-width:0}.answer-text{font-family:Poppins,sans-serif;font-size:1.4rem;font-weight:600;line-height:1.25;display:block}.picks{color:#a0a0b8;min-height:1.2em;margin-top:6px;font-size:.95rem;display:block}.answer.correct{background:#00d2a81f;border-color:#00d2a8}.answer.wrongish{background:#ff767514;border-color:#ff7675b3}.answer.dimmed{opacity:.35}#answered-count{color:#a0a0b8;min-height:1.4em;margin-top:22px;font-size:1rem}#scoreboard{flex-wrap:wrap;justify-content:center;gap:14px;margin-top:18px;display:flex}.score-row{background:#1a1a2e;border-radius:15px;align-items:center;gap:11px;padding:11px 20px;display:flex}.score-dot{background:#3a3a52;border-radius:50%;flex-shrink:0;width:10px;height:10px}.s </head>
<body>
    <div class="brand">
        <span class="logo"></span>
        <h1>PocketPlay</h1>
    </div>

    <section id="view-lobby">
        <p class="tagline">Your phone is the controller.</p>
        <p class="hint">Scan the QR code to join</p>
        <div id="qr-container">
            <img id="qr-code" alt="QR Code" />
        </div>
        <div id="qr-url"></div>
        <div id="status">Starting lobby...</div>
        <div id="players"></div>
        <button id="start-btn" class="primary-btn" disabled>START GAME</button>
    </section>

    <section id="view-game" hidden>
        <div class="hud">
            <span id="q-counter">Question 1 / 10</span>
            <div class="timer"><div id="timer-fill"></div></div>
            <span id="timer-num">20</span>
        </div>
        <h2 id="question-text"></h2>
        <div id="reveal-banner" hidden></div>
        <div id="answers">
            <div class="answer" data-index="0">
                <span class="badge badge-a">A</span>
                <div class="answer-body">
                    <span class="answer-text"></span>
                    <span class="picks"></span>
                </div>
            </div>
            <div class="answer" data-index="1">
                <span class="badge badge-b">B</span>
                <div class="answer-body">
                    <span class="answer-text"></span>
                    <span class="picks"></span>
                </div>
            </div>
            <div class="answer" data-index="2">
                <span class="badge badge-x">X</span>
                <div class="answer-body">
                    <span class="answer-text"></span>
                    <span class="picks"></span>
                </div>
            </div>
            <div class="answer" data-index="3">
                <span class="badge badge-y">Y</span>
                <div class="answer-body">
                    <span class="answer-text"></span>
                    <span class="picks"></span>
                </div>
            </div>
        </div>
        <div id="answered-count"></div>
        <div id="scoreboard"></div>
    </section>

    <section id="view-final" hidden>
        <p class="kicker">Winner</p>
        <div id="winner-name"></div>
        <div id="winner-score"></div>
        <ol id="rankings"></ol>
        <button id="again-btn" class="primary-btn">PLAY AGAIN</button>
    </section>

</body>
</html>
