<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>PocketPlay — Controller</title>
    <link rel="icon" type="image/png" href="/images/PocketPlayorg.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-base: #0A0A14;
            --bg-elevated: #12121F;
            --bg-card: #1A1A2E;
            --gradient-start: #22D3EE;
            --gradient-mid: #4F46E5;
            --gradient-end: #A855F7;
            --text-primary: #FFFFFF;
            --text-muted: #94A3B8;
            --glow-purple: rgba(139, 92, 246, 0.6);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --gradient: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-mid) 50%, var(--gradient-end) 100%);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .glow {
            position: fixed;
            width: 55vw; height: 55vw;
            max-width: 720px; max-height: 720px;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        .glow-tl {
            top: -18vw; left: -18vw;
            background: rgba(34, 211, 238, 0.15);
            animation: drift-a 12s ease-in-out infinite alternate;
        }
        .glow-br {
            bottom: -20vw; right: -18vw;
            background: rgba(168, 85, 247, 0.18);
            animation: drift-b 12s ease-in-out infinite alternate;
        }
        @keyframes drift-a {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(6vw, 5vw) scale(1.15); }
        }
        @keyframes drift-b {
            from { transform: translate(0, 0) scale(1.1); }
            to { transform: translate(-5vw, -6vw) scale(0.95); }
        }
        .fade-up {
            opacity: 0;
            transform: translateY(24px);
            animation: fade-up 0.6s ease forwards;
        }
        @keyframes fade-up { to { opacity: 1; transform: translateY(0); } }
        body {
            margin: 0;
            min-height: 100dvh;
            background:
                radial-gradient(120% 80% at 50% -10%, rgba(79, 70, 229, 0.22), transparent 60%),
                radial-gradient(120% 80% at 50% 110%, rgba(168, 85, 247, 0.18), transparent 60%),
                var(--bg-base);
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 22px 18px;
            user-select: none;
            overscroll-behavior: none;
            overflow-x: hidden;
        }

        /* ---- Gamepad shell ---- */
        section {
            position: relative;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            padding: 26px 20px 30px;
            border: 1px solid var(--border-subtle);
            border-radius: 34px;
            background: linear-gradient(180deg, rgba(26, 26, 46, 0.92) 0%, rgba(16, 16, 28, 0.94) 100%);
            box-shadow:
                0 34px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.07),
                inset 0 -18px 40px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        section[hidden] { display: none; }
        section::before {
            content: '';
            position: absolute;
            top: 14px; left: 50%;
            transform: translateX(-50%);
            width: 74px; height: 5px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        .brand img {
            width: 58px; height: 58px;
            border-radius: 16px;
            object-fit: cover;
            filter: drop-shadow(0 0 26px var(--glow-purple));
            animation: pulse 3s ease-in-out infinite;
        }
        .brand h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: -0.03em;
        }
        .grad-text {
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #join-panel { gap: 14px; }
        #name-input, #room-input {
            width: 100%;
            background: rgba(10, 10, 20, 0.65);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            color: var(--text-primary);
            padding: 17px;
            font-size: 1.1rem;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        #name-input::placeholder, #room-input::placeholder { color: var(--text-muted); }
        #name-input:focus, #room-input:focus {
            outline: none;
            border-color: var(--gradient-mid);
            box-shadow: 0 0 0 4px var(--glow-purple);
        }
        #color-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 2px 0;
        }
        .swatch {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            box-shadow: inset 0 -6px 12px rgba(0, 0, 0, 0.3), 0 4px 12px rgba(0, 0, 0, 0.4);
            transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
        }
        .swatch:hover { transform: scale(1.1); }
        .swatch.selected {
            border-color: var(--text-primary);
            box-shadow: 0 0 18px var(--glow-purple), inset 0 -6px 12px rgba(0, 0, 0, 0.3);
            transform: scale(1.12);
        }
        .swatch.taken {
            position: relative;
            opacity: 0.35;
            filter: grayscale(0.4);
        }
        .swatch.taken::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 1.1rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }
        .swatch.taken.selected { opacity: 0.75; filter: none; }
        .pick-label {
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 600;
            margin: 4px 0 0;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        #join-status {
            color: var(--text-muted);
            text-align: center;
            min-height: 1.5em;
            margin: 0 0 6px;
            font-size: 1rem;
        }
        #join-status.error { color: #FF7675; }

        /* ---- Chunky buttons ---- */
        #join-btn, #rejoin-btn {
            width: 100%;
            background: var(--gradient);
            background-size: 200% 200%;
            color: var(--text-primary);
            border: none;
            border-radius: 999px;
            padding: 19px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            cursor: pointer;
            box-shadow: 0 10px 34px rgba(79, 70, 229, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-position 0.4s ease;
            animation: gradient-shift 6s ease-in-out infinite;
        }
        #join-btn:hover, #rejoin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 44px rgba(124, 58, 237, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }
        #join-btn:active, #rejoin-btn:active { transform: scale(0.98); }
        #join-btn:disabled { opacity: 0.5; cursor: default; box-shadow: none; animation: none; }
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ---- Waiting / joystick idle ---- */
        #waiting-panel { text-align: center; gap: 4px; }
        .stick-idle {
            position: relative;
            width: 96px; height: 96px;
            margin: 4px 0 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #2a2a45, #101020 75%);
            box-shadow: inset 0 6px 16px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border-subtle);
        }
        .stick-idle::before {
            content: '';
            position: absolute; inset: 14px;
            border-radius: 50%;
            border: 2px solid rgba(139, 92, 246, 0.35);
            animation: spin 4s linear infinite;
        }
        .stick-idle::after {
            content: '';
            position: absolute; inset: 30px;
            border-radius: 50%;
            background: var(--gradient);
            box-shadow: 0 0 26px var(--glow-purple);
            animation: stick-nudge 2.4s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes stick-nudge {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(6px, -4px) scale(1.02); }
            50% { transform: translate(0, -7px) scale(1.04); }
            75% { transform: translate(-6px, -4px) scale(1.02); }
        }
        .waiting-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin: 0 0 8px;
            letter-spacing: -0.01em;
        }
        #waiting-name {
            font-size: 1.7rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin: 0 0 8px;
        }
        #waiting-dot {
            display: inline-block;
            width: 14px; height: 14px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
            box-shadow: 0 0 14px currentColor;
        }
        #waiting-text {
            color: var(--text-muted);
            margin: 0;
            line-height: 1.5;
        }
        #waiting-roster-wrap {
            margin-top: 18px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .waiting-count {
            margin: 0;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        #waiting-roster {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        .roster-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            font-size: 0.92rem;
            font-weight: 700;
            animation: chip-in 0.3s ease both;
        }
        .roster-chip.me {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.18), rgba(168, 85, 247, 0.18));
            border-color: rgba(139, 92, 246, 0.5);
        }
        .roster-chip.offline { opacity: 0.5; }
        .roster-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 10px -1px currentColor;
        }
        @keyframes chip-in {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---- Host remote (gamepad) ---- */
        #remote-pad {
            margin-top: 18px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        #remote-pad[hidden] { display: none; }
        .remote-hint {
            margin: 0;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .remote-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 34px;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 52px);
            grid-template-rows: repeat(3, 52px);
            gap: 4px;
        }
        .dpad-center {
            grid-area: 2 / 2;
            border-radius: 10px;
            background: radial-gradient(circle at 40% 35%, #2a2a45, #14142a 80%);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
        }
        .dpad-up { grid-area: 1 / 2; }
        .dpad-left { grid-area: 2 / 1; }
        .dpad-right { grid-area: 2 / 3; }
        .dpad-down { grid-area: 3 / 2; }
        .face-cluster {
            position: relative;
            width: 120px; height: 120px;
        }
        .pad-btn {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            background: linear-gradient(180deg, #232342, #14142a);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .pad-btn:active {
            transform: scale(0.94);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .dpad .pad-btn {
            border-radius: 12px;
            font-size: 1rem;
        }
        .face-a, .face-b {
            position: absolute;
            width: 62px; height: 62px;
            border-radius: 50%;
            font-size: 1.25rem;
        }
        .face-a {
            right: 0; bottom: 0;
            background: linear-gradient(180deg, #22c55e, #15803d);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 6px 18px rgba(34, 197, 94, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }
        .face-b {
            left: 0; top: 0;
            background: linear-gradient(180deg, #ef4444, #b91c1c);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 6px 18px rgba(239, 68, 68, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }
        .remote-sys { width: 100%; display: flex; justify-content: center; }
        .sys-btn {
            padding: 12px 22px;
            border-radius: 999px;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
        }
        .host-home {
            position: fixed;
            top: 14px; right: 14px;
            z-index: 30;
            padding: 10px 16px;
            border-radius: 999px;
            border: 1px solid rgba(139, 92, 246, 0.5);
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.22), rgba(168, 85, 247, 0.22));
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(6px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }
        .host-home[hidden] { display: none; }
        .host-home:active { transform: scale(0.95); }
        .dots::after {
            content: '';
            animation: dots 1.4s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        /* ---- Host lost ---- */
        #hostlost-panel { text-align: center; }
        .hostlost-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 8px 0 8px;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        #hostlost-text {
            color: var(--text-muted);
            margin: 0 0 20px;
            line-height: 1.5;
        }
        #rejoin-btn { margin-top: 0; }

        /* ---- In-game ---- */
        #game-panel { gap: 0; }
        .controller-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-size: 0.92rem;
            letter-spacing: 0.03em;
        }
        #c-q-counter {
            padding: 5px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-subtle);
        }
        #c-timer {
            font-size: 1.7rem;
            font-weight: 900;
            min-width: 2.4em;
            text-align: right;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        #c-timer.urgent {
            color: #FF7675;
            background: none;
            -webkit-background-clip: initial;
            background-clip: initial;
            animation: timer-throb 0.8s ease-in-out infinite;
        }
        @keyframes timer-throb {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.16); }
        }
        #c-question {
            font-weight: 700;
            font-size: 1.12rem;
            text-align: center;
            line-height: 1.4;
            margin: 2px 0 12px;
            min-height: 2.6em;
        }
        .feedback {
            text-align: center;
            min-height: 1.6em;
            margin: 0 0 12px;
            font-weight: 700;
            font-size: 1.02rem;
        }
        .feedback.accent { color: #A78BFA; }
        .feedback.good { color: #22D3EE; }
        .feedback.bad { color: #FF7675; }
        .feedback.muted { color: var(--text-muted); font-weight: 600; font-size: 0.96rem; }

        .button-grid {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
        }
        .answer-btn {
            position: relative;
            aspect-ratio: 1;
            border-radius: 28px;
            border: none;
            padding: 16px 14px;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Poppins', sans-serif;
            touch-action: none;
            cursor: pointer;
            overflow: hidden;
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.3), inset 0 -10px 22px rgba(0, 0, 0, 0.35), 0 10px 26px rgba(0, 0, 0, 0.45);
            transition: transform 0.05s, filter 0.15s, box-shadow 0.15s, opacity 0.2s;
        }
        .answer-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(120% 90% at 50% 0%, rgba(255, 255, 255, 0.28), transparent 55%);
            pointer-events: none;
        }
        .answer-btn:nth-child(1) { background: linear-gradient(160deg, #22D3EE, #0E7490); }
        .answer-btn:nth-child(2) { background: linear-gradient(160deg, #6366F1, #1E3A8A); }
        .answer-btn:nth-child(3) { background: linear-gradient(160deg, #A855F7, #6B21A8); }
        .answer-btn:nth-child(4) { background: linear-gradient(160deg, #E855C9, #701A75); }
        .answer-btn:not(:disabled):active {
            transform: scale(0.95);
            filter: brightness(1.2);
        }
        .answer-btn:disabled { cursor: default; filter: saturate(0.65) brightness(0.9); }
        .badge {
            position: relative;
            z-index: 1;
            width: 42px; height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 -4px 8px rgba(0, 0, 0, 0.25);
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 1.2rem;
        }
        .answer-btn .answer-text {
            position: relative;
            z-index: 1;
            font-size: 1.02rem;
            font-weight: 700;
            text-align: center;
            line-height: 1.25;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        }
        .answer-btn.chosen {
            box-shadow: 0 0 0 4px var(--text-primary), 0 0 32px var(--glow-purple);
        }
        .answer-btn.correct {
            box-shadow: 0 0 0 4px #22D3EE, 0 0 34px rgba(34, 211, 238, 0.7);
        }
        .answer-btn.wrong {
            box-shadow: 0 0 0 4px #FF7675, 0 0 30px rgba(255, 118, 117, 0.6);
            opacity: 0.9;
        }
        .answer-btn.dimmed { opacity: 0.32; }

        /* ---- End ---- */
        #end-panel { text-align: center; }
        .end-title {
            font-size: 1.6rem;
            font-weight: 900;
            margin: 8px 0 8px;
            letter-spacing: -0.02em;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        #end-text {
            color: var(--text-muted);
            margin: 0 0 18px;
            line-height: 1.5;
        }
        #end-scores {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
        }
        #end-scores li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            padding: 12px 18px;
            border-radius: 14px;
            margin-bottom: 9px;
            font-weight: 600;
        }
        #end-scores li:first-child {
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 24px rgba(168, 85, 247, 0.25);
        }
        #end-scores li span:last-child {
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }

        @media (prefers-reduced-motion: reduce) {
            .glow-tl, .glow-br, .stick-idle::before, .stick-idle::after,
            .brand img, #join-btn, #rejoin-btn, #c-timer.urgent { animation: none !important; }
        }
    </style>
</head>
<body>
    <div class="glow glow-tl"></div>
    <div class="glow glow-br"></div>

    <section id="join-panel" class="fade-up">
        <div class="brand">
            <img src="/images/PocketPlayorg.png" alt="PocketPlay" />
            <h1>Pocket<span class="grad-text">Play</span></h1>
        </div>
        <p id="join-status">Ready to join!</p>
        <input id="name-input" type="text" placeholder="Enter your name" maxlength="12" autocomplete="off" />
        <p class="pick-label">Pick your color</p>
        <div id="color-row"></div>
        <input id="room-input" type="text" placeholder="Room code (e.g. 4F7K)" maxlength="4" autocomplete="off" spellcheck="false" />
        <button id="join-btn">JOIN GAME</button>
    </section>

    <section id="waiting-panel" class="fade-up" hidden>
        <div class="stick-idle" aria-hidden="true"></div>
        <div id="waiting-name"><span id="waiting-dot"></span><span id="waiting-label"></span></div>
        <p class="waiting-title">Connected!</p>
        <p id="waiting-text">Waiting for the host to start the game<span class="dots"></span></p>
        <div id="waiting-roster-wrap">
            <p id="waiting-count" class="waiting-count"></p>
            <div id="waiting-roster"></div>
        </div>

        <div id="remote-pad" hidden>
            <p class="remote-hint">Host remote — drive the TV like a console</p>
            <div class="remote-layout">
                <div class="dpad">
                    <button class="pad-btn dpad-up" data-nav="UP" aria-label="Up">▲</button>
                    <button class="pad-btn dpad-left" data-nav="LEFT" aria-label="Left">◀</button>
                    <span class="dpad-center" aria-hidden="true"></span>
                    <button class="pad-btn dpad-right" data-nav="RIGHT" aria-label="Right">▶</button>
                    <button class="pad-btn dpad-down" data-nav="DOWN" aria-label="Down">▼</button>
                </div>
                <div class="face-cluster">
                    <button class="pad-btn face-b" data-nav="B" aria-label="Back">B</button>
                    <button class="pad-btn face-a" data-nav="A" aria-label="Select">A</button>
                </div>
            </div>
            <div class="remote-sys">
                <button class="pad-btn sys-btn" data-nav="FULLSCREEN">⛶ Fullscreen</button>
            </div>
        </div>
    </section>

    <button id="host-home" class="host-home" data-nav="HOME" aria-label="Back to dashboard" hidden>⌂ Home</button>

    <section id="hostlost-panel" class="fade-up" hidden>
        <p class="hostlost-title">Host disconnected</p>
        <p id="hostlost-text">The screen was reloaded or closed. Scan the QR code again to rejoin the game.</p>
        <button id="rejoin-btn">REJOIN</button>
    </section>

    <section id="game-panel" class="fade-up" hidden>
        <div class="controller-hud">
            <span id="c-q-counter">Q1 / 10</span>
            <span id="c-timer">20</span>
        </div>
        <p id="c-question"></p>
        <p id="c-feedback" class="feedback"></p>
        <div class="button-grid">
            <button class="answer-btn" data-index="0">
                <span class="badge">A</span>
                <span class="answer-text"></span>
            </button>
            <button class="answer-btn" data-index="1">
                <span class="badge">B</span>
                <span class="answer-text"></span>
            </button>
            <button class="answer-btn" data-index="2">
                <span class="badge">X</span>
                <span class="answer-text"></span>
            </button>
            <button class="answer-btn" data-index="3">
                <span class="badge">Y</span>
                <span class="answer-text"></span>
            </button>
        </div>
    </section>

    <section id="end-panel" class="fade-up" hidden>
        <p id="end-title" class="end-title">Game over</p>
        <p id="end-text"></p>
        <ul id="end-scores"></ul>
    </section>

    <script type="module" src="/src/controller.js"></script>
</body>
</html>
