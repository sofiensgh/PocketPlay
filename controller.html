<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>PocketPlay — Controller</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-base: #0A0A14;
            --bg-elevated: #12121F;
            --bg-card: #1A1A2E;
            --gradient-start: #22D3EE;
            --gradient-mid: #4F46E5;
            --gradient-end: #A855F7;
            --text-primary: #FFFFFF;
            --text-muted: #94A3B8;
            --glow-blue: rgba(59, 130, 246, 0.5);
            --glow-purple: rgba(139, 92, 246, 0.6);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --gradient: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-mid) 50%, var(--gradient-end) 100%);
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        .glow {
            position: fixed;
            width: 55vw;
            height: 55vw;
            max-width: 720px;
            max-height: 720px;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        .glow-tl {
            top: -18vw;
            left: -18vw;
            background: rgba(34, 211, 238, 0.15);
            animation: drift-a 12s ease-in-out infinite alternate;
        }
        .glow-br {
            bottom: -20vw;
            right: -18vw;
            background: rgba(168, 85, 247, 0.18);
            animation: drift-b 12s ease-in-out infinite alternate;
        }
        @keyframes drift-a {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(6vw, 5vw) scale(1.15); }
        }
        @keyframes drift-b {
            from { transform: translate(0, 0) scale(1.1); }
            to { transform: translate(-5vw, -6vw) scale(0.95); }
        }
        .fade-up {
            opacity: 0;
            transform: translateY(24px);
            animation: fade-up 0.6s ease forwards;
        }
        @keyframes fade-up {
            to { opacity: 1; transform: translateY(0); }
        }
        body {
            margin: 0;
            min-height: 100dvh;
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            user-select: none;
            overscroll-behavior: none;
            overflow-x: hidden;
        }
        section {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        section[hidden] { display: none; }
        #join-panel { gap: 14px; }
        #join-panel .logo {
            width: 88px;
            height: 88px;
            border-radius: 22px;
            object-fit: cover;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 32px var(--glow-purple));
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        #name-input, #room-input {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            color: var(--text-primary);
            padding: 17px;
            font-size: 1.15rem;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        #name-input::placeholder { color: var(--text-muted); }
        #name-input:focus, #room-input:focus {
            outline: none;
            border-color: var(--gradient-mid);
            box-shadow: 0 0 0 4px var(--glow-purple);
        }
        #color-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 2px 0;
        }
        .swatch {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
        }
        .swatch:hover { transform: scale(1.1); }
        .swatch.selected {
            border-color: var(--text-primary);
            box-shadow: 0 0 18px var(--glow-purple);
            transform: scale(1.12);
        }
        .pick-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            margin: 4px 0 0;
        }
        #join-status {
            color: var(--text-muted);
            text-align: center;
            min-height: 1.5em;
            margin: 0 0 12px;
            font-size: 1rem;
        }
        #join-status.error { color: #FF7675; }
        #join-btn, #rejoin-btn {
            width: 100%;
            background: var(--gradient);
            background-size: 200% 200%;
            color: var(--text-primary);
            border: none;
            border-radius: 999px;
            padding: 18px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            cursor: pointer;
            box-shadow: 0 8px 40px rgba(139, 92, 246, 0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-position 0.4s ease;
            animation: gradient-shift 6s ease-in-out infinite;
        }
        #join-btn:hover, #rejoin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 48px rgba(139, 92, 246, 0.65);
        }
        #join-btn:active, #rejoin-btn:active { transform: scale(0.98); }
        #join-btn:disabled { opacity: 0.5; cursor: default; box-shadow: none; animation: none; }
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        #waiting-panel { text-align: center; }
        .waiting-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0 0 10px;
        }
        #waiting-name {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin: 0 0 6px;
        }
        #waiting-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
        #waiting-text {
            color: var(--text-muted);
            margin: 0;
            line-height: 1.5;
        }
        .dots::after {
            content: '';
            animation: dots 1.4s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
        #hostlost-panel { text-align: center; }
        .hostlost-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 0 8px;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        #hostlost-text {
            color: var(--text-muted);
            margin: 0 0 20px;
            line-height: 1.5;
        }
        #rejoin-btn { margin-top: 0; }
        .controller-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        #c-timer {
            font-size: 1.3rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        #c-timer.urgent { color: #FF7675; background: none; -webkit-background-clip: initial; background-clip: initial; }
        #c-question {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            text-align: center;
            line-height: 1.4;
            margin: 4px 0 14px;
        }
        .feedback {
            text-align: center;
            min-height: 1.6em;
            margin: 0 0 14px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
        }
        .feedback.accent { color: #A78BFA; }
        .feedback.good { color: #22D3EE; }
        .feedback.bad { color: #FF7675; }
        .feedback.muted { color: var(--text-muted); font-weight: 600; font-size: 0.98rem; }
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }
        .answer-btn {
            aspect-ratio: 1;
            border-radius: 24px;
            border: 1px solid var(--border-subtle);
            padding: 16px 12px;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 11px;
            font-family: 'Poppins', sans-serif;
            touch-action: none;
            cursor: pointer;
            transition: transform 0.05s, filter 0.15s, box-shadow 0.15s, opacity 0.2s;
        }
        .answer-btn:nth-child(1) { background: linear-gradient(135deg, #22D3EE, #0E7490); box-shadow: 0 6px 26px rgba(34, 211, 238, 0.35); }
        .answer-btn:nth-child(2) { background: linear-gradient(135deg, #4F46E5, #1E3A8A); box-shadow: 0 6px 26px rgba(79, 70, 229, 0.4); }
        .answer-btn:nth-child(3) { background: linear-gradient(135deg, #A855F7, #6B21A8); box-shadow: 0 6px 26px rgba(168, 85, 247, 0.4); }
        .answer-btn:nth-child(4) { background: linear-gradient(135deg, #C026D3, #701A75); box-shadow: 0 6px 26px rgba(192, 38, 211, 0.35); }
        .answer-btn:not(:disabled):active {
            transform: scale(0.96);
            filter: brightness(1.25);
            box-shadow: 0 0 0 4px var(--glow-purple), 0 6px 26px rgba(139, 92, 246, 0.6);
        }
        .answer-btn:disabled { cursor: default; filter: saturate(0.7); }
        .badge {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.16);
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 1.2rem;
        }
        .answer-btn .answer-text {
            font-size: 1.05rem;
            font-weight: 600;
            text-align: center;
            line-height: 1.3;
        }
        .answer-btn.chosen {
            box-shadow: 0 0 0 3px var(--text-primary), 0 8px 32px rgba(139, 92, 246, 0.6);
        }
        .answer-btn.correct {
            box-shadow: 0 0 0 3px #22D3EE, 0 8px 32px rgba(34, 211, 238, 0.6);
        }
        .answer-btn.wrong {
            box-shadow: 0 0 0 3px #FF7675, 0 8px 32px rgba(255, 118, 117, 0.5);
            opacity: 0.85;
        }
        .answer-btn.dimmed { opacity: 0.4; }
        #end-panel { text-align: center; }
        .end-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 0 8px;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        #end-text {
            color: var(--text-muted);
            margin: 0 0 18px;
            line-height: 1.5;
        }
        #end-scores {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
        }
        #end-scores li {
            display: flex;
            justify-content: space-between;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 12px 18px;
            border-radius: 13px;
            margin-bottom: 9px;
            font-weight: 600;
        }
        #end-scores li span:last-child {
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="glow glow-tl"></div>
    <div class="glow glow-br"></div>

    <section id="join-panel" class="fade-up">
        <img class="logo" src="/logo.png" alt="PocketPlay" />
        <p id="join-status">Ready to join!</p>
        <input id="name-input" type="text" placeholder="Enter your name" maxlength="12" autocomplete="off" />
        <p class="pick-label">Pick your color</p>
        <div id="color-row"></div>
        <input id="room-input" type="text" placeholder="Room code (e.g. 4F7K)" maxlength="4" autocomplete="off" spellcheck="false" />
        <button id="join-btn">JOIN GAME</button>
    </section>

    <section id="waiting-panel" class="fade-up" hidden>
        <div id="waiting-name"><span id="waiting-dot"></span><span id="waiting-label"></span></div>
        <p class="waiting-title">Connected!</p>
        <p id="waiting-text">Waiting for the host to start the game<span class="dots"></span></p>
    </section>

    <section id="hostlost-panel" class="fade-up" hidden>
        <p class="hostlost-title">Host disconnected</p>
        <p id="hostlost-text">The screen was reloaded or closed. Scan the QR code again to rejoin the game.</p>
        <button id="rejoin-btn">REJOIN</button>
    </section>

    <section id="game-panel" class="fade-up" hidden>
        <div class="controller-hud">
            <span id="c-q-counter">Q1 / 10</span>
            <span id="c-timer">20</span>
        </div>
        <p id="c-question"></p>
        <p id="c-feedback" class="feedback"></p>
        <div class="button-grid">
            <button class="answer-btn" data-index="0">
                <span class="badge">A</span>
                <span class="answer-text"></span>
            </button>
            <button class="answer-btn" data-index="1">
                <span class="badge">B</span>
                <span class="answer-text"></span>
            </button>
            <button class="answer-btn" data-index="2">
                <span class="badge">X</span>
                <span class="answer-text"></span>
            </button>
            <button class="answer-btn" data-index="3">
                <span class="badge">Y</span>
                <span class="answer-text"></span>
            </button>
        </div>
    </section>

    <section id="end-panel" class="fade-up" hidden>
        <p id="end-title" class="end-title">Game over</p>
        <p id="end-text"></p>
        <ul id="end-scores"></ul>
    </section>

    <script type="module" src="/src/controller.js"></script>
</body>
</html>
